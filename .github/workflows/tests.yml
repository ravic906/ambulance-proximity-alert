name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  browser:
    runs-on: ubuntu-latest
    needs: unit
    env:
      OPERATOR_KEY: ci-test-key
      BASE_URL: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Start the app
        run: |
          gunicorn --workers 1 --threads 8 --bind 127.0.0.1:5000 app:app &
          for i in $(seq 1 30); do curl -sf "$BASE_URL/" >/dev/null && exit 0; sleep 1; done
          echo "app did not start"; exit 1
      - run: node tests/e2e/smoke.js
