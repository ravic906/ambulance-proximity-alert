<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambulance Proximity Alert</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #111; color: #eee; text-align: center; padding: 60px 20px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    p.sub { color: #999; margin-bottom: 40px; }
    a.role {
      display: block; margin: 20px auto; max-width: 300px;
      padding: 20px; border-radius: 12px; text-decoration: none;
      font-size: 1.1rem; font-weight: 600;
    }
    a.ambulance { background: #e63946; color: white; }
    a.driver { background: #457b9d; color: white; }
    a.demo { background: #2a9d8f; color: white; }
    p.note { color: #777; font-size: 0.85rem; max-width: 320px; margin: 6px auto 0; }
    hr { border: none; border-top: 1px solid #333; max-width: 300px; margin: 36px auto 16px; }
  </style>
</head>
<body>
  <h1>🚑 Ambulance Proximity Alert</h1>
  <p class="sub">Warns only the drivers on the road ahead of an ambulance</p>
  <a class="role demo" href="/demo">▶ Try the one-screen demo</a>
  <p class="note">No phones or GPS needed — a simulated ambulance drives a real route.</p>
  <hr>
  <p class="note">Live mode, with two phones:</p>
  <a class="role ambulance" href="/ambulance">I'm the Ambulance</a>
  <a class="role driver" href="/driver">I'm a Driver</a>
</body>
</html>
