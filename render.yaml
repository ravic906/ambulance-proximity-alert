services:
  - type: web
    name: ambulance-proximity-alert
    runtime: python
    plan: starter   # the free plan sleeps after inactivity; reviewers then wait ~30 s on first load
    buildCommand: pip install -r requirements.txt
    # One worker: mission state is held in memory, so every request must reach the same process.
    startCommand: gunicorn --workers 1 --threads 8 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: OPERATOR_KEY
        generateValue: true
